# Render Blueprint for the Spring Boot backend.
#
# This is a monorepo: the backend lives in ./backend, so rootDir points there and
# every other path below is relative to it. If you configure the service through
# the Render dashboard instead of this Blueprint, set "Root Directory" to
# `backend` there — otherwise Render looks for the Dockerfile at the repo root
# and the build fails.
#
# The database is NOT provisioned here. Render's free plan allows only one free
# Postgres per account, and this account already has one, so a Blueprint-managed
# database hangs indefinitely instead of failing cleanly. Provision Postgres
# externally (Neon, Supabase) and paste its connection string into DATABASE_URL in
# the Render dashboard. The application translates that postgres:// URL into a JDBC
# URL at startup — see DatabaseUrlEnvironmentPostProcessor.
#
# To use MySQL instead — which is what the project brief specifies — set DB_URL,
# DB_USERNAME and DB_PASSWORD instead of DATABASE_URL. An explicit DB_URL always
# takes precedence.

services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        sync: false                  # your Neon/Supabase postgres:// connection string
      - key: JWT_SECRET
        generateValue: true          # generates a long value, safely over the 32-char minimum
      - key: ADMIN_EMAIL
        sync: false                  # your admin login
      - key: ADMIN_PASSWORD
        sync: false                  # set this — do not ship the built-in default
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # your Vercel URL, e.g. https://your-app.vercel.app
