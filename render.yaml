# Render Blueprint for the Spring Boot backend.
#
# This is a monorepo: the backend lives in ./backend, so rootDir points there and
# every other path below is relative to it. If you configure the service through
# the Render dashboard instead of this Blueprint, set "Root Directory" to
# `backend` there — otherwise Render looks for the Dockerfile at the repo root
# and the build fails.
#
# The database below is provisioned by this Blueprint on Render's free tier, and
# its connection string is injected as DATABASE_URL. The application translates
# that postgres:// URL into a JDBC URL at startup (see
# DatabaseUrlEnvironmentPostProcessor), so there is nothing to copy by hand.
#
# To use MySQL instead — which is what the project brief specifies — leave the
# databases block out, provision a MySQL elsewhere (Aiven / Clever Cloud), and set
# DB_URL, DB_USERNAME and DB_PASSWORD manually. An explicit DB_URL always takes
# precedence over DATABASE_URL.

databases:
  - name: ecommerce-db
    plan: free
    databaseName: ecommerce
    user: ecommerce

services:
  - type: web
    name: ecommerce-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /swagger-ui/index.html
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: ecommerce-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true          # generates a long value, safely over the 32-char minimum
      - key: ADMIN_EMAIL
        sync: false                  # your admin login
      - key: ADMIN_PASSWORD
        sync: false                  # set this — do not ship the built-in default
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false                  # your Vercel URL, e.g. https://your-app.vercel.app
