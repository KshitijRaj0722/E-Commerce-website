# Test-only configuration: in-memory H2, no external MySQL or Razorpay needed.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test-secret-key-that-is-long-enough-for-hmac-sha256-signing
app.jwt.expiration=3600000

razorpay.key.id=rzp_test_key
razorpay.key.secret=rzp_test_secret

app.cors.allowed-origins=http://localhost:3000
app.admin.seed-enabled=false
